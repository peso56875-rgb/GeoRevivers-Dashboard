<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>GeoRivers Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#f3f6f4;padding:25px}
.header{background:#17463c;color:white;padding:25px;border-radius:15px}
.controls,.card,.chart,table{background:white;border-radius:15px;padding:20px;margin-top:20px}
select{padding:12px;border-radius:8px;margin:5px}
.cards{display:flex;gap:15px;flex-wrap:wrap}

<div class="header">
<h1>GeoRivers</h1>
<h2>Waste Management Dashboard</h2>
</div>

<div class="controls">
<h3>Filter</h3>

</select>

اختار نوع المخلف:
<select id="type">
<option value="all">كل الأنواع</option>
<option>Crushed Asphalt</option><option>Crushed Ceramic</option><option>Crushed Concrete</option><option>Plastic</option><option>Steel</option>
</select>
</div>

<div class="cards">
<div class="card"><h3>إجمالي الكمية</h3><h1 id="total"></h1></div>
<div class="card"><h3>عدد العمليات</h3><h1 id="count"></h1></div>
</div>

<div class="chart"><canvas id="chart"></canvas></div>

<table>
<thead><tr><th>الشهر</th><th>النوع</th><th>الكمية</th><th>النقطة</th></tr></thead>
<tbody id="table"></tbody>
</table>
